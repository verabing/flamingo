<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flamingo by Style</title>

  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="favicon.ico">

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

  <style>
    :root {
      --accent:#db3553;
      --accent-weak:#fbe3e7;
      --bg:#fff;
      --text:#2b2b2b;
      --muted:#666;
      --border:#eee;
      --shadow:0 6px 24px rgba(0,0,0,.06);
      --radius:14px;
    }

    * { box-sizing:border-box; margin:0; padding:0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, Segoe UI, Roboto, Inter, sans-serif;
      min-height: 100vh;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--accent);
      color: white;
      text-align: center;
      padding: 14px;
      font-weight: 800;
      font-size: 22px;
      z-index: 10;
    }

    .top-buttons {
      position: absolute;
      top: 50%;
      left: 12px;
      display: flex;
      gap: 10px;
      z-index: 30;
      transform: translateY(-50%);
    }

    .top-btn {
      display: inline-flex;
      align-itms: center;
      justify-content: center;

      height: 40px;
      padding: 0 16px;
      border-radius: 10px;
      border: 1px solid #fff;
      background: transparent;
      color: #fff;

      font-size: 14px:
      font-weight: 600;
      line-weight: 1;
      white-space: nowrap;
    }

    #backBtn { display: none; }

    main {
      padding: 30px 20px 60px;
      text-align: center;
    }

    .style-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }

    .style-btn {
      padding: 12px 20px;
      background: var(--accent-weak);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 24px;
      justify-items: center;
      margin-top: 30px;
    }

    .artist-card {
      max-width: 180px;
      text-align: center;
    }

    .artist-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .artist-label {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    .center-title {
      font-size: 34px;
      font-weight: 900;
      color: var(--accent);
      margin-top: 10px;
    }

    .hidden { display: none; }

    footer {
      text-align: center;
      font-size: 12px;
      color: #777;
      margin: 40px auto 20px;
      max-width: 600px;
    }
  </style>
</head>

<body>

  <header>
  Flamingo by Style
  <div class="top-buttons">
    <a href="https://verabing.github.io/flamingo/" class="top-btn">Back to main gallery</a>
    <button class="top-btn" id="backBtn">← Back to styles</button>
  </div>
</header>

  <main>
    <div id="styleList" class="style-grid"></div>
    <h1 id="styleTitle" class="center-title hidden"></h1>
    <div id="galleryView" class="gallery-grid"></div>
    <p id="errorMsg" class="hidden">⚠️ Ingen data funnet.</p>
  </main>

  <footer>
    All flamingo artworks are AI interpretations inspired by the styles of various artists.
  </footer>

  <script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSYBfBoXuMzFZPMimNJ_ksoMWv2lfEsaCy0JfqbTBHngqxDQVmmT6Lq9LeT7rR7jNPaL_yDNdVBt6my/pub?output=csv";


    const els = {
      styleList: document.getElementById("styleList"),
      galleryView: document.getElementById("galleryView"),
      styleTitle: document.getElementById("styleTitle"),
      backBtn: document.getElementById("backBtn"),
      errorMsg: document.getElementById("errorMsg")
    };

    let rows = [];

    const norm = s => String(s || "").trim().toLowerCase();

    Papa.parse(SHEET_CSV_URL, {
  download: true,
  header: true,
  skipEmptyLines: true,
  complete: res => {
    if (!res.data.length) {
      els.errorMsg.textContent = "⚠️ Ingen data i arket.";
      els.errorMsg.classList.remove("hidden");
      return;
    }

    const colStyle  = "Art style";
    const colPhoto  = "Photo";
    const colArtist = "artist";

    rows = res.data.filter(r => r[colArtist]);

    if (!rows.length) {
      els.errorMsg.textContent = "⚠️ Ingen rader med artist funnet.";
      els.errorMsg.classList.remove("hidden");
      return;
    }

    initStyles(colStyle, colPhoto, colArtist);
  }
});


    function initStyles(colStyle, colPhoto, colArtist) {
      const styles = [
        ...new Set(
          rows.flatMap(r =>
            String(r[colStyle] || "")
              .split(",")
              .map(s => s.trim())
              .filter(Boolean)
          )
        )
      ].sort();

      els.styleList.innerHTML = "";
      styles.forEach(style => {
        const btn = document.createElement("button");
        btn.className = "style-btn";
        btn.textContent = style;
        btn.onclick = () => showStyle(style, colStyle, colPhoto, colArtist);
        els.styleList.appendChild(btn);
      });
    }

    function showStyle(style, colStyle, colPhoto, colArtist) {
      els.styleList.style.display = "none";
      els.styleTitle.textContent = style;
      els.styleTitle.classList.remove("hidden");
      els.backBtn.style.display = "inline-block";
      els.galleryView.innerHTML = "";

      rows
        .filter(r =>
          String(r[colStyle] || "")
            .toLowerCase()
            .split(",")
            .map(s => s.trim())
            .includes(style.toLowerCase())
        )
        .forEach(r => {
          const card = document.createElement("div");
          card.className = "artist-card";
          card.innerHTML = `
            <img src="${r[colPhoto]}" alt="${r[colArtist]}">
            <div class="artist-label">${r[colArtist]}</div>
          `;
          els.galleryView.appendChild(card);
        });
    }

    els.backBtn.onclick = () => {
      els.galleryView.innerHTML = "";
      els.styleList.style.display = "flex";
      els.styleTitle.classList.add("hidden");
      els.backBtn.style.display = "none";
    };
  </script>
</body>
</html>
